[plugin]

name="Emberfall Map"
description="Edit the hand-authored world in the Godot viewport. Loads data/authored_world.json, spawns a draggable marker for every building, prop, tree, fence end, NPC post, resource zone and landmark, and writes the file back byte-identically so the Node pipeline and tools/validate_world.js keep working."
author="Nexara Studios"
version="1.0"
script="plugin.gd"
