; Emberfall - web export preset.
;
; Exports to ../play/index.html, so the finished layout on the host is:
;
;   public_html/
;     index.html          the existing Three.js client, still works
;     js/ css/ assets/    its files
;     api/                the PHP server, shared by both clients
;     data/
;     play/               THIS export
;       index.html
;       index.js
;       index.wasm
;       index.pck
;       .htaccess
;
; Both clients hit the same /api, so accounts, the world and chat are shared.
;
; thread_support is OFF on purpose. Godot's threaded web builds need
; SharedArrayBuffer, which the browser only grants when the server sends
; Cross-Origin-Opener-Policy and Cross-Origin-Embedder-Policy headers. Plenty
; of shared hosts will not let you set those, and a threaded build without them
; fails to start with an error most people cannot act on. Single-threaded works
; everywhere. If your host does allow the headers, see play/.htaccess - it has
; them commented out with a note.

[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="addons/emberfall_map/*, scenes/map_editor.tscn"
export_path="../play/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0.07, 0.06, 0.05, 1)
